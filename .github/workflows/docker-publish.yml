name: Build and Publish Container to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "v*", "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version from GitHub runner variables
        id: versioning
        run: |
          RERUN=$((${{ github.run_attempt }} - 1))
          VERSION="1.${{ github.run_number }}.${RERUN}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed GitHub runner version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versioning.outputs.version }},enable={{is_default_branch}}
            type=raw,value=v${{ steps.versioning.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git release tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.versioning.outputs.version }}"
          if ! git rev-parse "${VERSION}" >/dev/null 2>&1; then
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}" || echo "Tag push ${VERSION} skipped"
          fi
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}" || echo "Tag push v${VERSION} skipped"
          fi
